name: Refresh contribution graph

on:
  schedule:
    - cron: "17 8 * * *"   # daily, 08:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contribution calendar
        env:
          # A classic PAT with read:user, so private contributions are counted.
          # Falls back to GITHUB_TOKEN, which sees public contributions only.
          GH_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN || github.token }}
        run: ./scripts/fetch-contributions.sh "${{ github.repository_owner }}"

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/data/contributions.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/contributions.json
          git commit -m "Refresh contribution graph data"
          git push
